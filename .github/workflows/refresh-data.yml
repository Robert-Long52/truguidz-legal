name: Refresh site data

# Pulls the latest public GitHub, YouTube and Dev.to data into data/*.json so the
# site stays current without anyone touching it. Visitors' browsers never call
# those services; they only read the committed JSON files.
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REDDIT_USER: ${{ vars.REDDIT_USER }}
        run: python3 scripts/fetch_data.py
      - name: Commit changes
        run: |
          git config user.name "site-refresh[bot]"
          git config user.email "site-refresh@users.noreply.github.com"
          git add data img/media
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Refresh site data"
            git push
          fi
